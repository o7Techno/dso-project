apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-planner-ingress
  labels:
    app: event-planner
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: event-planner.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: event-planner-service
            port:
              number: 80
  tls:
  - hosts:
    - event-planner.example.com
    secretName: event-planner-tls
