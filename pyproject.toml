[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-planner"
version = "0.2.0"
description = "Event Planner - Planning local events without invitations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.112.2",
    "uvicorn==0.30.5",
    "python-multipart",
    "httpx==0.27.2",
    "pydantic>=2.0.0",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md"]

[tool.ruff]
line-length = 100
select = ["E","F","W","I"]
target-version = "py311"
exclude = ["venv",".venv","build","dist"]

[tool.isort]
profile = "black"
line_length = 100

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert_used (OK in tests)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv", ".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = [
    "httpx.*",
    "fastapi.*",
    "pydantic.*",
    "starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80"
