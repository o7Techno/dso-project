name: CI/CD Pipeline

on:
  push:
    branches: [main, p08-cicd-minimal]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, windows-latest]
        include:
          - python-version: "3.12"
            os: ubuntu-latest
            primary: true

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        timeout-minutes: 3

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        timeout-minutes: 5
        env:
          PIP_CACHE_DIR: ${{ env.PIP_CACHE_DIR }}

      - name: Run ruff
        run: ruff check .
        timeout-minutes: 3
        continue-on-error: ${{ !matrix.primary }}

      - name: Run black (check)
        run: black --check .
        timeout-minutes: 3
        continue-on-error: ${{ !matrix.primary }}

      - name: Run isort (check)
        run: isort --check-only .
        timeout-minutes: 3
        continue-on-error: ${{ !matrix.primary }}

      - name: Create reports directory
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mkdir reports 2>$null || true
          else
            mkdir -p reports
          fi
        shell: bash

      - name: Run pytest with coverage
        run: |
          python -m pytest -q --cov=app --cov-report=xml --cov-report=html --cov-report=term --junit-xml=reports/junit.xml
        timeout-minutes: 10
        continue-on-error: ${{ !matrix.primary }}

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml-${{ matrix.os }}-${{ matrix.python-version }}
          path: reports/junit.xml
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            reports/
            *.log
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
        timeout-minutes: 2

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-pip-

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build wheel
          pip install -r requirements.txt
        timeout-minutes: 5

      - name: Build wheel
        run: |
          python -m build --wheel
        timeout-minutes: 5

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheel-package
          path: dist/*.whl
          retention-days: 30
          if-no-files-found: error

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        timeout-minutes: 2

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: event-planner:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
          load: true
        timeout-minutes: 10

      - name: Save Docker image to tarball
        run: |
          docker save event-planner:latest -o docker-image.tar
        timeout-minutes: 5

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    name: Deploy to Staging (Mock)
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.example.com

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wheel-package
          path: dist/

      - name: Mock deployment to staging
        run: |
          echo "Mock deployment to staging environment"
          echo "Environment: ${{ env.STAGING_ENV }}"
          echo "Deploying version: ${{ github.sha }}"
          echo "Artifacts downloaded: $(ls -la dist/ || echo 'No artifacts')"
          echo "Staging deployment completed (dry-run)"
        env:
          STAGING_ENV: staging
          # В реальном проекте здесь были бы секреты:
          # STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          # STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        timeout-minutes: 3

      - name: Health check (mock)
        run: |
          echo "Performing health check..."
          echo "Service is healthy (mock)"
        timeout-minutes: 2

  promote-to-prod:
    name: Promote to Production (Mock)
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://prod.example.com

    permissions:
      contents: read

    steps:
      - name: Manual approval gate (mock)
        run: |
          echo "Waiting for manual approval..."
          echo "Approval granted (mock - auto-approve in CI)"
        timeout-minutes: 1

      - name: Promote to production
        run: |
          echo "Promoting to production environment"
          echo "Version: ${{ github.sha }}"
          echo "Production deployment completed (dry-run)"
        env:
          PROD_ENV: production
          # В реальном проекте:
          # PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          # PROD_API_KEY: ${{ secrets.PROD_API_KEY }}
        timeout-minutes: 3

      - name: Production health check (mock)
        run: |
          echo "Performing production health check..."
          echo "Production service is healthy (mock)"
        timeout-minutes: 2
