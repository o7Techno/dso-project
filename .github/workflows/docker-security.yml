name: Docker Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  hadolint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: hadolint-results.sarif

      - name: Show hadolint issues
        run: cat hadolint-results.sarif
        if: always()

  trivy-scan:
    name: Security Scan with Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE_TAG: v1.0.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file if not exists
        run: |
          if [ ! -f .env ]; then
            echo "# Auto-generated for CI" > .env
            echo "APP_PORT=8000" >> .env
          fi

      - name: Build Docker image
        run: docker compose build
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Tag image as latest for compatibility
        run: |
          docker tag dso-project-app:${{ env.IMAGE_TAG }} dso-project-app:latest || true

      - name: Verify image exists
        run: |
          if ! docker images | grep -q "dso-project-app.*${{ env.IMAGE_TAG }}"; then
            echo "ERROR: Image dso-project-app:${{ env.IMAGE_TAG }} not found"
            docker images
            exit 1
          fi
          echo "✓ Image dso-project-app:${{ env.IMAGE_TAG }} found"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dso-project-app:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: false

      - name: Check if SARIF file exists
        id: check_sarif
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✓ SARIF file exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠ SARIF file not found, skipping upload"
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check_sarif.outputs.exists == 'true'
        with:
          sarif_file: trivy-results.sarif

      - name: Generate Trivy report
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: dso-project-app:${{ env.IMAGE_TAG }}
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 30

  container-tests:
    name: Container Security Tests
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: v1.0.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env file if not exists
        run: |
          if [ ! -f .env ]; then
            echo "# Auto-generated for CI" > .env
            echo "APP_PORT=8000" >> .env
          fi

      - name: Build Docker image
        run: docker compose build
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

      - name: Start container
        run: docker compose up -d

      - name: Check non-root user
        run: |
          user_id=$(docker compose exec -T app id -u)
          if [ "$user_id" != "1000" ]; then
            echo "ERROR: Container runs as user ID $user_id, expected 1000"
            exit 1
          fi
          echo "✓ Container runs as non-root user (UID: $user_id)"

      - name: Check container health
        run: |
          timeout=60
          while [ $timeout -gt 0 ]; do
            health=$(docker inspect --format='{{.State.Health.Status}}' event-planner-app 2>/dev/null || echo "starting")
            if [ "$health" = "healthy" ]; then
              echo "✓ Container is healthy"
              exit 0
            fi
            echo "Waiting for container to become healthy... ($health)"
            sleep 5
            timeout=$((timeout-5))
          done
          echo "✗ Container did not become healthy"
          docker compose logs app
          exit 1

      - name: Test API endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
          if [ "$response" != "200" ]; then
            echo "ERROR: API endpoint returned HTTP $response"
            exit 1
          fi
          echo "✓ API endpoint responds correctly (HTTP $response)"

      - name: Cleanup
        if: always()
        run: docker compose down -v
